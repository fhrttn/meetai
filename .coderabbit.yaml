language: "tr-TR" # Türkçe inceleme ve özetler için standart format

reviews:
  profile: "chill" # Esnek, daha az gürültülü inceleme modu ("assertive" yerine)
  high_level_summary: true # Üst düzey PR özeti
  walkthrough: true # Dosya bazlı detaylı değişiklik dökümü
  sequence_diagrams: true # Akış diyagramları (Sequence Diagram)
  poem: true # PR sonundaki şiir
  auto_review:
    enabled: true
    drafts: false # Taslak (Draft) halindeki PR'ları incelemez

chat:
  auto_reply: true # PR yorumlarında sorduğunuz sorulara otomatik yanıt verir
